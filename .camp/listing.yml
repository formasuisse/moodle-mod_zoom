name: mod_zoom
summary: Activity module that integrates with Zoom meetings/webinars.
description: |
  The Zoom activity module allows teachers to create and manage Zoom meetings
  and webinars directly within Moodle. Students can join meetings, view recordings,
  and see meeting schedules without leaving the course.
